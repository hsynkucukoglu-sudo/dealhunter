name: Hoogvliet Scraper

# hoogvliet.com zit achter Imperva/Incapsula en serveert datacenter-IP's een
# JS-challenge. De fetch-scraper op Railway kreeg daardoor 0 producten terug
# (stil, want een lege markt wordt bewust niet leeggemaakt). Playwright met
# stealth komt er wel doorheen — zelfde aanpak als de Kruidvat-scraper.
#
# ─── DAGELIJKSE PLANNING UITGEZET (2026-08-09) ───────────────────────────────
# Ook met Playwright+stealth blijft Imperva deze runner blokkeren: de workflow
# faalde elke dag (laatste gezien: 6 aug, "All jobs have failed") en Hoogvliet
# staat op 0 producten in de database. Het besluit "Hoogvliet niet verder
# najagen" stond al vast; alleen de cron liep nog door en stuurde elke dag een
# faalmail. Dat is meer dan ruis: het traint je om faalmails van deze repo weg
# te klikken, en juist daardoor mis je een échte storing (AH stond 5 dagen stil).
#
# workflow_dispatch blijft staan — wil je het ooit opnieuw proberen, dan draai
# je hem met de hand. Zet de cron pas terug als een handmatige run slaagt.
# on:
#   schedule:
#     - cron: '20 8 * * *'

on:
  workflow_dispatch:

jobs:
  scrape-hoogvliet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        working-directory: .github/scripts
        run: |
          npm install
          npx playwright install chromium --with-deps

      # GEEN continue-on-error: die verborg runs #1 (2 aug) en #2 (3 aug) als groen
      # vinkje terwijl beide "exit code 1" gaven (0 producten opgehaald) — precies de
      # stille storing die deze workflow had moeten oplossen, nu door mezelf herhaald.
      - name: Run Hoogvliet scraper
        working-directory: .github/scripts
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node hoogvliet-scraper.js
