name: Albert Heijn Scraper

on:
  schedule:
    # Elke dag 08:10 UTC — na de backend-cron (08:00), zodat deze run de AH-data
    # overschrijft die de backend daar niet kan ophalen (Akamai blokkeert Railway).
    - cron: '10 8 * * *'
  workflow_dispatch:

jobs:
  scrape-ah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        working-directory: .github/scripts
        run: |
          npm install
          npx playwright install chromium --with-deps

      # BEWUST GEEN continue-on-error: bij Hoogvliet verborg die vlag maandenlang
      # een stille storing (de job werd groen terwijl de stap faalde). Faalt deze
      # stap, dan faalt de workflow zichtbaar en komt er een mail.
      - name: Run AH scraper
        working-directory: .github/scripts
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node ah-scraper.js
