name: Daily Deals Video

# Maakt elke maandag de "Top 5 Supermarkt Deals"-video en levert die op twee manieren:
#   1. als artifact, om handmatig naar TikTok/Reels te zetten mét trending audio
#      (die kun je alleen in de app toevoegen, en zonder audio kost het bereik)
#   2. automatisch naar YouTube Shorts, waar een stille video minder pijn doet
#
# Maandagochtend omdat de Nederlandse folders dan vers zijn; 06:30 UTC ligt ruim
# na de scraper-runs van 08:02 lokale tijd van de vorige dag.

# ─── WEKELIJKSE PLANNING UITGEZET (2026-08-11) ───────────────────────────────
# Beide afleverroutes zitten vast:
#   1. De handmatige TikTok/Reels-route vraagt tijd die er niet is (het
#      tijdsbudget voor social is ~0 uur per week).
#   2. De YouTube-route heeft nooit secrets gekregen (staat open sinds 2 aug), en
#      secrets alléén is niet genoeg: zolang de OAuth-app op "Testing" staat
#      verloopt de refresh token na 7 dagen en faalt een wekelijkse cron sowieso
#      elke keer.
# Ondertussen kwam er elke maandag een faalmail (laatst 10 aug). Dat is duurder
# dan het lijkt: het went om meldingen uit deze repo weg te klikken, en precies
# daardoor bleven Hoogvliet en Albert Heijn dagenlang stil kapot. Nu het
# scraper-alarm net écht is gaan mailen, mag ruis dat signaal niet overstemmen.
#
# De videogenerator zelf werkt en blijft staan — draai hem met de hand wanneer
# je een video wil. Zet de cron pas terug als de YouTube-app "In production"
# staat én een handmatige run slaagt.
# ─── DAGELIJKS PLAN (klaargezet 2026-08-19, cron nog uit) ────────────────────
# make-video.mjs kiest de editie op weekdag (zie tools/tiktok-video/editions.mjs):
#   zo actie · ma top5 · di categorie · wo markt · do kassakoopjes ·
#   vr bespaar · za categorie (andere rotatie)
# Zeven keer dezelfde top-5 uploaden zou als duplicaat lezen; dit zijn zeven
# verschillende doorsnedes van dezelfde dataset.
#
# Zet de cron pas aan als BEIDE waar zijn:
#   1. YOUTUBE_CLIENT_ID / _SECRET / _REFRESH_TOKEN staan in de repo-secrets
#   2. de OAuth-app staat op "In production" — op "Testing" verloopt de refresh
#      token na 7 dagen en faalt elke cron daarna
# Zie docs/youtube-shorts-plan.md voor het stappenplan.
#
# on:
#   schedule:
#     - cron: '30 6 * * *'   # elke dag 06:30 UTC (08:30 NL)

on:
  workflow_dispatch:
    inputs:
      editie:
        description: 'Welke editie? Leeg = automatisch op weekdag'
        type: choice
        options: ['', 'top5', 'categorie', 'markt', 'kassakoopjes', 'bespaar', 'actie']
        default: ''
      upload_youtube:
        description: 'Ook naar YouTube uploaden? (vereist YOUTUBE_*-secrets)'
        type: boolean
        # Default false: de secrets ontbreken, dus met true zou een handmatige run
        # de video wél maken maar daarna alsnog rood eindigen op de upload-stap.
        default: false
      privacy:
        description: 'YouTube privacy (private/unlisted/public)'
        type: string
        default: private

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        working-directory: tools/tiktok-video
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Generate video
        working-directory: tools/tiktok-video
        env:
          EDITIE: ${{ inputs.editie }}
        run: node make-video.mjs

      # Altijd bewaren, ook als de YouTube-stap faalt — de handmatige route naar
      # TikTok/Reels mag daar niet van afhangen.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealhunter-daily-video
          path: |
            tools/tiktok-video/out/*.mp4
            tools/tiktok-video/out/*.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload to YouTube Shorts
        if: github.event_name == 'schedule' || inputs.upload_youtube
        working-directory: tools/tiktok-video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy || 'private' }}
        run: node upload-youtube.mjs
